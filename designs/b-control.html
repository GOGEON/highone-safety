<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 B · 관제형 — 하이원 스키장 안전 관제 콘솔</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
/* ============================================================
   시안 B "관제형" — 어두운 운영 콘솔 문법
   높은 정보 밀도, 등폭 숫자, 배치 의사결정 우선. 타깃: 운영자
   ============================================================ */
:root{
  --bg:#0d0f12; --panel:#1c1f24; --panel2:#15181c; --line:#2a2f36; --hair:#22262c;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b; --series:#3987e5;

  /* 차트 엔진 계약 (다크 서피스 기준으로 다시 고른 값) */
  --viz-surface:#1c1f24; --viz-ink:#ffffff; --viz-ink-2:#c3c2b7; --viz-muted:#898781;
  --viz-grid:#2c2c2a; --viz-axis:#383835; --viz-series:#3987e5;
  /* 다크 배경에서는 '많음'이 밝아야 하므로 램프를 어두움→밝음으로 뒤집는다 */
  --viz-seq:#184f95,#256abf,#3987e5,#86b6ef,#cde2fb;
  --viz-empty:rgba(255,255,255,.05); --viz-hover:rgba(255,255,255,.06); --viz-focus:#86b6ef;
  --viz-tip-bg:#0d0f12; --viz-tip-ink:#ffffff; --viz-tip-border:rgba(255,255,255,.22);
}
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  line-height:1.55; -webkit-font-smoothing:antialiased;
}
.mono{ font-family:ui-monospace,"Cascadia Mono","Consolas",monospace; font-variant-numeric:tabular-nums; }
.wrap{ max-width:1180px; margin:0 auto; padding:0 18px 60px; }

/* ---------- 상단 바 ---------- */
.bar{ border-bottom:1px solid var(--line); background:var(--panel2); }
.bar .wrap{ padding-top:12px; padding-bottom:12px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.logo{ display:flex; align-items:center; gap:9px; }
.logo .dot{ width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px rgba(12,163,12,.2); }
.logo h1{ margin:0; font-size:13.5px; font-weight:700; letter-spacing:.01em; }
.logo span{ font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.bar .spacer{ flex:1; }
.stamp{ font-size:11px; color:var(--muted); letter-spacing:.03em; }

/* ---------- 필터 ---------- */
.ctl{
  position:sticky; top:0; z-index:20; background:rgba(13,15,18,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line); margin-bottom:18px;
}
.ctl .wrap{ padding-top:10px; padding-bottom:10px; display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
.grp{ display:flex; align-items:center; gap:6px; }
.grp > .lb{ font-size:10.5px; color:var(--muted); letter-spacing:.09em; text-transform:uppercase; margin-right:3px; }
.chip{
  font:inherit; font-size:12px; font-weight:600; color:var(--ink2);
  font-variant-numeric:tabular-nums;
  padding:4px 11px; border-radius:5px; border:1px solid var(--line);
  background:var(--panel); cursor:pointer; transition:.14s;
}
.chip:hover{ border-color:var(--series); color:#fff; }
.chip[aria-pressed="true"]{ background:var(--series); border-color:var(--series); color:#fff; }

/* ---------- KPI 타일 ---------- */
.kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:10px; margin-bottom:18px; }
.kpi{ background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:13px 15px; }
.kpi dt{ font-size:10.5px; color:var(--muted); letter-spacing:.07em; text-transform:uppercase; margin:0 0 6px; }
.kpi dd{ margin:0; font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.15; }
.kpi .u{ font-size:12px; font-weight:600; color:var(--ink2); margin-left:2px; }
.kpi .sub{ font-size:11.5px; color:var(--muted); margin-top:4px; }

/* ---------- 패널 ---------- */
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:18px; margin-bottom:14px; }
.panel > .ch-root + .ch-root{ margin-top:24px; padding-top:20px; border-top:1px solid var(--hair); }
.ptitle{ display:flex; align-items:baseline; gap:9px; margin:0 0 14px; }
.ptitle h2{ margin:0; font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
.ptitle span{ font-size:11.5px; color:var(--muted); }
.cols{ display:grid; grid-template-columns:1.55fr 1fr; gap:14px; }
.cols2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:900px){ .cols,.cols2{ grid-template-columns:1fr; } }

/* ---------- 상태 요약 ---------- */
.statusrow{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
.slug{
  display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:8px;
  font-size:14px; font-weight:700; color:#0d0f12;
}
.slug .ic{ font-size:15px; }
.statusrow .desc{ font-size:12.5px; color:var(--ink2); flex:1; min-width:220px; }

/* ---------- 타임라인 ---------- */
.tl{ display:flex; gap:2px; border-radius:6px; overflow:hidden; }
.tl div{ flex:1; height:34px; position:relative; }
.tl div span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-size:11px; font-weight:700; color:#0d0f12;
}
.tlx{ display:flex; gap:2px; margin-top:5px; }
.tlx div{ flex:1; text-align:center; font-size:10px; color:var(--muted); }
.tlleg{ display:flex; gap:14px; margin-top:12px; flex-wrap:wrap; }
.tlleg i{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink2); font-style:normal; }
.tlleg b{ width:11px; height:11px; border-radius:3px; display:inline-block; }

/* ---------- 배치 테이블 ---------- */
.ops{ width:100%; border-collapse:collapse; font-size:12.5px; }
.ops th,.ops td{ padding:9px 7px; border-bottom:1px solid var(--hair); text-align:right; }
.ops th{ font-size:10.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-weight:700; }
.ops td:first-child,.ops th:first-child{ text-align:left; }
.ops tbody tr:hover{ background:rgba(255,255,255,.035); }
.tag{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:700; color:#0d0f12; }
.meter{ display:inline-flex; gap:2px; vertical-align:middle; }
.meter i{ width:6px; height:13px; border-radius:1px; background:var(--series); }
.meter i.off{ background:var(--line); }

/* ---------- 알림 ---------- */
.alert{
  display:flex; gap:11px; background:var(--panel2); border:1px solid var(--line);
  border-left:3px solid var(--series); border-radius:8px; padding:12px 14px;
  font-size:12.5px; color:var(--ink2); margin-top:14px;
}
.alert b{ color:#fff; }
.alert .ic{ flex:none; color:var(--series); font-weight:700; }

/* ---------- 출처 ---------- */
.src{ font-size:11.5px; color:var(--muted); }
.src h2{ font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); margin:0 0 9px; }
.src ul{ margin:0; padding-left:16px; } .src li{ margin-bottom:5px; }
.src a{ color:var(--series); }
.back{ display:inline-block; margin-top:18px; font-size:12.5px; color:var(--series); text-decoration:none; font-weight:600; }
</style>
</head>
<body>

<div class="bar"><div class="wrap">
  <div class="logo">
    <span class="dot" aria-hidden="true"></span>
    <h1>HIGH1 SAFETY OPS</h1>
    <span>스키장 안전 관제 콘솔</span>
  </div>
  <div class="spacer"></div>
  <div class="stamp mono" id="stamp"></div>
</div></div>

<div class="ctl"><div class="wrap">
  <div class="grp"><span class="lb">Season</span><div class="grp" id="fMonth"></div></div>
  <div class="grp"><span class="lb">Day</span><div class="grp" id="fDow"></div></div>
</div></div>

<div class="wrap">

  <dl class="kpis" id="kpis"></dl>

  <div class="cols">
    <section class="panel">
      <div class="ptitle"><h2>시간대 위험 타임라인</h2><span id="tlWhen"></span></div>
      <div class="statusrow">
        <span class="slug" id="slug"><span class="ic" id="slugIc"></span><span id="slugTx"></span></span>
        <p class="desc" id="slugDesc"></p>
      </div>
      <div class="tl" id="tl"></div>
      <div class="tlx" id="tlx"></div>
      <div class="tlleg">
        <i><b style="background:var(--good)"></b>✓ 안전 &lt;30</i>
        <i><b style="background:var(--warning)"></b>! 주의 30–58</i>
        <i><b style="background:var(--critical)"></b>✕ 위험 ≥58</i>
        <i><b style="background:var(--line)"></b>— 전환 정비</i>
      </div>
      <div id="cRisk" style="margin-top:22px"></div>
    </section>

    <section class="panel">
      <div class="ptitle"><h2>안전요원 배치 우선순위</h2></div>
      <table class="ops">
        <thead><tr><th>시간대</th><th>사고</th><th>누적</th><th>지수</th><th>배치</th></tr></thead>
        <tbody id="opsBody" class="mono"></tbody>
      </table>
      <div class="alert" id="opsAlert"></div>
    </section>
  </div>

  <section class="panel"><div id="cHeat"></div></section>

  <div class="cols2">
    <section class="panel"><div id="cHour"></div><div class="alert" id="noteHour"></div></section>
    <section class="panel"><div id="cDow"></div><div class="alert" id="noteDow"></div></section>
  </div>

  <div class="cols2">
    <section class="panel"><div id="cMonthAcc"></div></section>
    <section class="panel"><div id="cMonthRate"></div><div class="alert" id="noteRate"></div></section>
  </div>

  <section class="panel"><div id="cWx"></div><div class="alert" id="noteWx"></div></section>

  <section class="panel src">
    <h2>Data sources &amp; method</h2>
    <ul id="srcList"></ul>
    <p style="margin:11px 0 0" id="method"></p>
  </section>

  <a class="back" href="../compare.html">← 다른 시안 보기</a>
</div>

<script src="../data/dataset.js?v=2"></script>
<script src="../shared/model.js?v=2"></script>
<script src="../shared/charts.js?v=2"></script>
<script src="../shared/app.js?v=2"></script>
<script>
(function(){
  const M = window.MODEL, D = M.D, A = window.APP, S = M.summary;
  const state = { month:1, dow:5 };
  const STATUS = { good:'var(--good)', warning:'var(--warning)', critical:'var(--critical)' };
  const col = lv => STATUS[lv.token];

  document.getElementById('stamp').textContent =
    `DATA 2024 SEASON · ${M.num(S.totalAccidents)} INCIDENTS · ${S.openDays} OPERATING DAYS`;

  A.chips(document.getElementById('fMonth'), M.MONTHS.map(m=>({v:m,t:m+'월'})),
    ()=>state.month, v=>{state.month=v; render();});
  A.chips(document.getElementById('fDow'), M.DOW_KO.map((t,i)=>({v:i,t})),
    ()=>state.dow, v=>{state.dow=v; render();});

  function kpi(dt, dd, unit, sub){
    return `<div class="kpi"><dt>${dt}</dt>
      <dd class="mono">${dd}${unit?`<span class="u">${unit}</span>`:''}</dd>
      <div class="sub">${sub}</div></div>`;
  }

  function render(){
    A.syncChips();
    const { month:m, dow:w } = state;
    const prof = M.dayProfile(m,w), rec = M.recommend(m,w);
    const when = `${m}월 ${M.DOW_KO[w]}요일`;
    const peak = prof.reduce((a,b)=>b.score>a.score?b:a);
    const ci = M.crowdIndex(m,w);
    const est = Math.round(D.meta.meanDaily * M.monthCrowdF[m] * M.dowF[w]);
    const danger = prof.filter(p=>p.level.key==='danger' && p.session.key!=='break').length;

    document.getElementById('kpis').innerHTML =
      kpi('선택 조건','' + m + '월 ' + M.DOW_KO[w], '', '조회 기준') +
      kpi('최고 위험지수', peak.score, '', `${M.hrange(peak.hour)} · ${peak.level.label}`) +
      kpi('위험 등급 시간대', danger, '개', `전체 ${prof.length-1}개 운영 시간대 중`) +
      kpi('혼잡지수', ci, '', A.crowdWord(ci) + ` · 계수 ×${(M.monthCrowdF[m]*M.dowF[w]).toFixed(2)}`) +
      kpi('예상 리프트권', M.num(est), '매', '해당 월·요일 일평균') +
      kpi('권장 이용 시간', M.hhmm(rec.bestDay.hour), '',
          `주간 최저 ${rec.bestDay.score} · 야간 ${M.hhmm(rec.bestNight.hour)}(${rec.bestNight.score})`);

    document.getElementById('tlWhen').textContent = when;
    const slug = document.getElementById('slug');
    slug.style.background = col(peak.level);
    document.getElementById('slugIc').textContent = peak.level.icon;
    document.getElementById('slugTx').textContent = `${peak.level.label} · ${M.hrange(peak.hour)}`;
    document.getElementById('slugDesc').textContent =
      `${peak.level.desc}. 위험지수 ${peak.score}점 — 전체 조합 최댓값(${M.riskMaxLabel})을 100으로 둔 상대 지수입니다.`;

    const tl = document.getElementById('tl'), tlx = document.getElementById('tlx');
    tl.innerHTML = ''; tlx.innerHTML = '';
    prof.forEach(p => {
      const brk = p.session.key==='break';
      const d = document.createElement('div');
      d.style.background = brk ? 'var(--line)' : col(p.level);
      d.innerHTML = `<span>${brk ? '—' : p.level.icon}</span>`;
      d.title = brk ? '주간→야간 전환 정비'
        : `${M.hrange(p.hour)} · 위험지수 ${p.score} (${p.level.label}) · 2024년 사고 ${p.accidents}건`;
      tl.appendChild(d);
      const x = document.createElement('div');
      x.className = 'mono'; x.textContent = M.pad(p.hour);
      tlx.appendChild(x);
    });

    CH.bars(document.getElementById('cRisk'), {
      title: `${when} 위험지수`,
      subtitle: '막대 위 기호(✓ ! ✕)가 등급을 함께 나타내므로 색이 보이지 않아도 판독됩니다.',
      data: prof.map(p=>({label:M.pad(p.hour), value:p.score, p,
        emphasis:p.hour===peak.hour, dim:p.session.key==='break'})),
      height:220, yMax:100, yTicks:4,
      color: d=>col(d.p.level),
      glyph: d=>d.p.session.key==='break'?null:d.p.level.icon,
      glyphColor: d=>col(d.p.level),
      directLabel: d=>d.p.hour===peak.hour,
      tooltip: d=>[[`${M.hrange(d.p.hour)} · ${d.p.level.label}`,''],
        ['위험지수',d.value],['2024년 사고',d.p.accidents+'건'],
        ['전체 사고 중',d.p.share+'%'],['운영 구분',d.p.session.label]],
      xTitle:'시각',
      table:{ cols:['시각','위험지수','등급','사고','비중'],
        rows: prof.map(p=>[M.hrange(p.hour),p.score,p.level.label,p.accidents+'건',p.share+'%']),
        caption:`${when} 기준` },
    });

    const st = M.staffing(m,w), tb = document.getElementById('opsBody');
    tb.innerHTML=''; let cum=0;
    st.forEach(s=>{
      cum += s.cover;
      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td><b>${M.hrange(s.hour)}</b></td>
         <td>${s.accidents}</td><td>${cum.toFixed(1)}%</td><td>${s.score}</td>
         <td><span class="tag" style="background:${col(s.level)}">${s.level.icon}${s.level.label}</span>
             <span class="meter" aria-label="배치 등급 ${s.crew}단계">
               ${[1,2,3].map(i=>`<i class="${i<=s.crew?'':'off'}"></i>`).join('')}</span></td>`;
      tb.appendChild(tr);
    });
    document.getElementById('opsAlert').innerHTML =
      `<span class="ic" aria-hidden="true">▲</span><div>상위 5개 시간대가 ${when} 사고의 ` +
      `<b>${cum.toFixed(0)}%</b>를 차지합니다. 이 구간에 안전요원을 집중 배치하면 ` +
      `동일 인력으로 더 많은 사고 노출을 커버할 수 있습니다.</div>`;
  }

  A.staticCharts({
    hour:'cHour', monthAcc:'cMonthAcc', monthRate:'cMonthRate',
    heat:'cHeat', dow:'cDow', wx:'cWx',
    noteHour:'noteHour', noteRate:'noteRate', noteDow:'noteDow', noteWx:'noteWx',
    srcList:'srcList', method:'method',
  });

  render();
})();
</script>
</body>
</html>
